# Builds and publishes a release, started by hand from the Actions tab.
#
# The version is not kept in any file. Leave it blank for the next patch
# after the last release (v0.1.4 gives 0.1.5), or type one for a bigger step.
# The release is created as a draft by default, with notes generated from the
# pull requests merged since the last release: read and edit it on the
# Releases page, then publish it there. The tag is created when it is
# published.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 0.2.0. Blank for the next patch
        required: false
        default: ""
      draft:
        description: Create it as a draft, to publish from the Releases page
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    env:
      INPUT_VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.draft }}
      LLVM_CONFIG: /usr/bin/llvm-config-18
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history, so the last release tag can be found.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          last=${last:-0.0.0}
          if [ -z "$INPUT_VERSION" ]; then
            IFS=. read -r major minor patch <<< "$last"
            version="$major.$minor.$((patch + 1))"
          else
            version=$INPUT_VERSION
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a version like 0.2.0."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$last" "$version" | sort -V | tail -1)" != "$version" ] ||
             [ "$version" = "$last" ]; then
            echo "::error::$version is not after the last release, $last."
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::A release v$version already exists, perhaps as a draft."
            exit 1
          fi
          echo "Releasing $version (last release: $last)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18

      - name: Run the tests
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          make check HOST_CC=clang-18

      - name: Build the payload
        run: |
          make sdk
          make RELEASE_VERSION="$VERSION"
          sha256sum ps-floppy.elf > SHA256SUMS

      - name: Create the release
        run: |
          draft=""
          if [ "$DRAFT" = "true" ]; then
            draft="--draft"
          fi
          gh release create "v$VERSION" $draft \
            --target "$GITHUB_SHA" \
            --title "ps-floppy $VERSION" \
            --generate-notes \
            ps-floppy.elf SHA256SUMS
