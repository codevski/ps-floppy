# Builds and publishes a release, started by hand from the Actions tab.
#
# Before running it, merge a pull request that sets VERSION in the Makefile
# and turns the changelog's "Unreleased" section into "## <version> - <date>".
# The release is created as a draft by default: read it on the Releases page,
# then publish it there. The tag is created when it is published.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as in the Makefile, for example 0.2.0
        required: true
      draft:
        description: Create it as a draft, to publish from the Releases page
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.draft }}
      LLVM_CONFIG: /usr/bin/llvm-config-18
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a version like 0.2.0."
            exit 1
          fi
          in_makefile=$(sed -n 's/^VERSION := //p' Makefile)
          if [ "$in_makefile" != "$VERSION" ]; then
            echo "::error::The Makefile says $in_makefile. Merge the version bump first."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1 ||
             git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists."
            exit 1
          fi
          awk -v head="## $VERSION " '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section starting '## $VERSION '."
            exit 1
          fi

      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18

      - name: Run the tests
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          make check HOST_CC=clang-18

      - name: Build the payload
        run: |
          make sdk
          make
          sha256sum ps-floppy.elf ps-floppy.elf.json > SHA256SUMS

      - name: Create the release
        run: |
          draft=""
          if [ "$DRAFT" = "true" ]; then
            draft="--draft"
          fi
          gh release create "v$VERSION" $draft \
            --target "$GITHUB_SHA" \
            --title "ps-floppy $VERSION" \
            --notes-file notes.md \
            ps-floppy.elf ps-floppy.elf.json SHA256SUMS
