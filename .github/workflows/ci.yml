# Tests and a console build for every pull request, and for main after a
# merge. The built payload is attached to each run and linked from the run's
# summary and from a comment on the pull request, so it can be tried on a
# console before it is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18

      # Ubuntu 24.04's address randomisation is too wide for the sanitizers.
      - name: Allow the sanitizers to run
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run the tests
        run: make check HOST_CC=clang-18

  console:
    name: Console build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # the comment linking the payload
    env:
      LLVM_CONFIG: /usr/bin/llvm-config-18
    steps:
      # The pull request's own commit, not GitHub's temporary merge with main,
      # so the payload's version names a commit that exists on the pull
      # request. Full history, so the version can be worked out from the tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18

      - name: Fetch the PS5 payload SDK
        run: make sdk

      - name: Build the payload
        run: make

      # Not zipped: the link downloads ps-floppy.elf itself, ready to load.
      - name: Keep the payload
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          path: ps-floppy.elf
          archive: false
          if-no-files-found: error

      - name: Describe the payload
        env:
          URL: ${{ steps.artifact.outputs.artifact-url }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(cat build/version)
          size=$(( $(stat -c %s ps-floppy.elf) / 1024 ))
          sum=$(sha256sum ps-floppy.elf | cut -d' ' -f1)
          {
            echo "### Built payload"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Download | [ps-floppy.elf]($URL) |"
            echo "| Version | $version |"
            echo "| Size | $size KB |"
            echo "| Commit | ${HEAD::7} |"
            echo "| SHA-256 | \`$sum\` |"
            echo
            echo "<sub>Downloading needs a GitHub login. Kept for 90 days.</sub>"
          } > payload.md
          cat payload.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, edited on each push. Pull requests from
      # forks get a read-only token, so they only have the summary.
      - name: Link it on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file payload.md
